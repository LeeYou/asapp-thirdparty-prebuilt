name: libcef
version: "102.0.10+gf249b2e+chromium-102.0.5005.115"
kind: shared-runtime
license: BSD-like
windows_min_os: win7
notes: "Official CEF binary stage (no rebuild). Sandbox lib excluded by default. Wrapper sources under libcef_dll/. Runtime DLLs live in Release/ (CEF upstream layout)."
linkage: shared
toolchain:
  generator: n/a-official-binary
  preferred: msvc-abi-prebuilt
runtime_files:
  - Release/*.dll
  - Release/*.bin
  - Release/*.json
plugin_dirs:
  - locales
  - Resources
paths:
  include: include
  lib: lib
  bin: Release
  resources: Resources
  locales: locales
  sdk_cmake: cmake
  sdk_wrapper: libcef_dll
